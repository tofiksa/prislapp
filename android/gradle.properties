org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Run Gradle on JDK 25 (Gradle 9.5+). JDK 24 worked with Gradle 8.14+ for unit tests;
# JDK 25 needs Gradle 9.5.x because Kotlin DSL in 8.x does not parse Java 25.
# App bytecode still targets Java 17 (see app/build.gradle.kts compileOptions).
# Optional machine override: org.gradle.java.home=/path/to/jdk-25
