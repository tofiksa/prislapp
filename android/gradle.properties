org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# Run Gradle on JDK 25 (Gradle 9.5+). JDK 24 worked with Gradle 8.14+ for unit tests;
# JDK 25 needs Gradle 9.5.x because Kotlin DSL in 8.x does not parse Java 25.
# App bytecode still targets Java 17 (see app/build.gradle.kts compileOptions).
# Optional machine override: org.gradle.java.home=/path/to/jdk-25
